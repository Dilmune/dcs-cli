version: 2
project_name: dcs

env:
  - GOWORK=off
  - GOTOOLCHAIN=local
  - GOFLAGS=-mod=readonly

before:
  hooks:
    - go mod tidy -diff
    - go mod verify

builds:
  - main: ./cmd/dcs/
    binary: dcs
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=true
    hooks:
      post:
        - 'govulncheck -mode=binary "{{ .Path }}"'
    ldflags:
      - -s -w
      - -X github.com/dilmune/dcs-cli/internal/commands.Commit={{ .FullCommit }}
      - -X github.com/dilmune/dcs-cli/internal/commands.BuildDate={{ .CommitDate }}
      - -X github.com/dilmune/dcs-cli/internal/client.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
          mode: 0644
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
          mode: 0644
      - src: THIRD_PARTY_NOTICES.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
          mode: 0644

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-snapshot"

changelog:
  disable: true

# Only the separate, approval-gated upload job can publish.
release:
  disable: true
